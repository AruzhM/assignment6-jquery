<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DOM Manipulation with jQuery</h1>
    <h2>Task 5: Add & Remove Elements</h2>

    <ul id="itemList">
        <li>First Item</li>
        <li>Second Item</li>
    </ul>

    <button id="appendBtn">Append Item</button>
    <button id="prependBtn">Prepend Item</button>
    <button id="removeBtn">Remove Item</button>

    
<hr>

<h2>Task 6: Modifying Attributes</h2>

<img id="changeImage"
     src="https://placehold.co/300x200/ffc8dd/333333?text=First+Image"
     alt="Demo Image">

<br>

<button id="changeImageBtn">Change Image</button>

<p>
    <a id="dynamicLink"
       href="https://www.google.com"
       target="_blank"
       rel="noopener noreferrer">
       Visit Google
    </a>
</p>

<button id="changeLinkBtn">Change Link</button>

<hr>

<h2>Task 7: Form Interaction</h2>

<form id="userForm">
    <label for="userName">Name:</label>
    <input type="text" id="userName"
           placeholder="Enter your name">

    <br><br>

    <label for="userEmail">Email:</label>
    <input type="email" id="userEmail"
           placeholder="Enter your email">
</form>

<h3>Live Preview:</h3>

<p>Name: <span id="namePreview"></span></p>
<p>Email: <span id="emailPreview"></span></p>
    
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dom.js"></script>
    
</body>
</html>
