<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>jQuery Animations</h1>
    <h2>Task 8: Basic Animation</h2>

    <button id="animateBtn">Animate Box</button>
    <button id="resetBtn">Reset</button>

    <div class="animationArea">
        <div id="animateBox"></div>
    </div>

    
<hr>

<h2>Task 9: Sequential Animations</h2>

<button id="sequenceBtn">Start Sequence</button>
<button id="sequenceResetBtn">Reset</button>

<div class="animationArea">
    <div id="sequenceBox"></div>
</div>


<hr>

<h2>Task 10: Combined Animation</h2>

<button id="combinedBtn">Start Animation</button>
<button id="combinedResetBtn">Reset</button>

<div class="animationArea">
    <div id="combinedBox"></div>
</div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="animations.js"></script>
</body>
</html>
